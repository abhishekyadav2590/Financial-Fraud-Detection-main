{% extends "base.html" %}
{% block title %}{{ status_code }} {{ error_title }} | FinShield AI{% endblock %}
{% block content %}
<div class="error-state card border-0 shadow-sm mx-auto text-center">
    <div class="card-body p-5">
        <div class="error-code">{{ status_code }}</div><div class="feature-icon mx-auto my-3"><i class="bi bi-compass"></i></div>
        <h1 class="h3">{{ error_title }}</h1>
        <p class="text-muted">{{ error_message }}</p>
        <div class="d-flex justify-content-center gap-2"><a class="btn btn-primary" href="{{ url_for('home') }}"><i class="bi bi-house me-1"></i>Go home</a>{% if current_user.is_authenticated %}<a class="btn btn-outline-primary" href="{{ url_for('dashboard') }}">Dashboard</a>{% endif %}</div>
    </div>
</div>
{% endblock %}
